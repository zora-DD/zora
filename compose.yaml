services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    environment:
      POSTGRES_DB: zora
      POSTGRES_USER: zora
      POSTGRES_PASSWORD: zora
    ports:
      - "54328:5432"
    volumes:
      - zora-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zora -d zora"]
      interval: 3s
      timeout: 3s
      retries: 20

  zora:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ZORA_ADDR: :8088
      ZORA_STORE_PROVIDER: postgres
      ZORA_POSTGRES_DSN: postgres://zora:zora@postgres:5432/zora?sslmode=disable
      ZORA_POSTGRES_MAX_CONNS: 10
      ZORA_REDIS_URL: redis://redis:6379/0
      ZORA_REPLICA_COUNT: ${ZORA_REPLICA_COUNT:-1}
      ZORA_AUTH_ENABLED: ${ZORA_AUTH_ENABLED:-false}
      ZORA_GITHUB_OAUTH_CLIENT_ID: ${ZORA_GITHUB_OAUTH_CLIENT_ID:-}
      ZORA_GITHUB_OAUTH_CLIENT_SECRET: ${ZORA_GITHUB_OAUTH_CLIENT_SECRET:-}
      ZORA_GITHUB_OAUTH_REDIRECT_URL: ${ZORA_GITHUB_OAUTH_REDIRECT_URL:-http://localhost:8088/api/auth/callback}
      ZORA_COOKIE_SECURE: ${ZORA_COOKIE_SECURE:-false}
      ZORA_MODEL_PROVIDER: mock
      ZORA_MULTI_AGENT_ENABLED: ${ZORA_MULTI_AGENT_ENABLED:-false}
      ZORA_REFLECTION_ENABLED: ${ZORA_REFLECTION_ENABLED:-true}
      ZORA_INPUT_GUARD_ENABLED: ${ZORA_INPUT_GUARD_ENABLED:-true}
      ZORA_TOPIC_RELEVANCE_THRESHOLD: ${ZORA_TOPIC_RELEVANCE_THRESHOLD:-0.08}
      ZORA_IMPLICIT_FEEDBACK_ENABLED: ${ZORA_IMPLICIT_FEEDBACK_ENABLED:-true}
      ZORA_EMBEDDING_PROVIDER: hash
      ZORA_EMBEDDING_DIMENSIONS: 384
      ZORA_OTEL_ENABLED: ${ZORA_OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      ZORA_PROMETHEUS_ENABLED: ${ZORA_PROMETHEUS_ENABLED:-false}
      ZORA_METRICS_TOKEN: ${ZORA_METRICS_TOKEN:-}
    ports:
      - "8088:8088"

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "63798:6379"
    volumes:
      - zora-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
    profiles: ["observability"]
    ports:
      - "4318:4318"
      - "16686:16686"

  prometheus:
    image: prom/prometheus:v3.13.1
    profiles: ["observability"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"

volumes:
  zora-postgres-data:
  zora-redis-data:
