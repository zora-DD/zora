apiVersion: v1
kind: ConfigMap
metadata:
  name: zora-config
data:
  # 生产配置在启动时会强制检查 PostgreSQL、Redis、GitHub 登录、HTTPS Cookie 和监控凭据。
  ZORA_ADDR: ":8088"
  ZORA_DATA_DIR: "/tmp/zora"
  ZORA_STORE_PROVIDER: "postgres"
  # 这是单 Pod 上限；HPA 最大 6 副本时总预算为 60，仍需按实际 RDS 连接上限调整。
  ZORA_POSTGRES_MAX_CONNS: "10"
  ZORA_REPLICA_COUNT: "2"

  ZORA_AUTH_ENABLED: "true"
  ZORA_GITHUB_OAUTH_CLIENT_ID: "CHANGE_ME_GITHUB_CLIENT_ID"
  ZORA_GITHUB_OAUTH_REDIRECT_URL: "https://zora.example.com/api/auth/callback"
  ZORA_AUTH_SESSION_TTL: "24h"
  ZORA_COOKIE_SECURE: "true"
  ZORA_CSRF_ENABLED: "true"
  # 必须替换为 ALB 后端连接实际来源的 vSwitch CIDR，禁止配置 0.0.0.0/0 或整个超大 VPC 网段。
  ZORA_TRUSTED_PROXY_CIDRS: "CHANGE_ME_ALB_PROXY_CIDR"
  ZORA_CORS_ALLOWED_ORIGINS: ""

  ZORA_RATE_LIMIT_ENABLED: "true"
  ZORA_RATE_LIMIT_REQUESTS_PER_SECOND: "10"
  ZORA_RATE_LIMIT_BURST: "20"
  ZORA_DAILY_REQUEST_QUOTA: "10000"
  ZORA_DAILY_CHAT_QUOTA: "500"
  ZORA_DAILY_UPLOAD_BYTES_QUOTA: "104857600"

  # 模型、Embedding 与供应商地址由 zora-secrets 中的 ai-config.json 注入，不进入 ConfigMap。
  ZORA_AI_CONFIG_FILE: "/var/run/zora-secrets/ai-config.json"

  ZORA_OTEL_ENVIRONMENT: "production"
  OTEL_SERVICE_NAME: "zora"
  # 购买并配置 ARMS/Collector 后再开启，避免 Trace 出口不存在时持续重试。
  ZORA_OTEL_ENABLED: "false"
  ZORA_OTEL_SAMPLE_RATIO: "0.1"
  ZORA_PROMETHEUS_ENABLED: "true"

  ZORA_MULTI_AGENT_ENABLED: "true"
  ZORA_REFLECTION_ENABLED: "true"
  ZORA_INPUT_GUARD_ENABLED: "true"
  ZORA_TOPIC_RELEVANCE_THRESHOLD: "0.08"
  ZORA_IMPLICIT_FEEDBACK_ENABLED: "true"
  ZORA_MESSAGE_RECALL_ENABLED: "true"
  ZORA_MEMORY_AUTO_CAPTURE: "true"
  ZORA_MEMORY_RECALL_ENABLED: "true"
  ZORA_SUMMARY_ENABLED: "true"
