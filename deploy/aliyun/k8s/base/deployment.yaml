apiVersion: apps/v1
kind: Deployment
metadata:
  name: zora
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zora
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zora
    spec:
      automountServiceAccountToken: false
      # Agent/SSE 默认最长 90 秒；滚动升级时给请求和 preStop 留足排空时间。
      terminationGracePeriodSeconds: 120
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # Kubernetes Secret 默认文件权限不符合 Zora 的 0400/0600 强校验；initContainer 复制后收紧权限。
      initContainers:
        - name: prepare-secrets
          image: alpine:3.23
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              cp /secret-input/* /secret-runtime/ &&
              chown -R 10001:10001 /secret-runtime &&
              chmod 0400 /secret-runtime/*
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: secret-input
              mountPath: /secret-input
              readOnly: true
            - name: secret-runtime
              mountPath: /secret-runtime
      containers:
        - name: zora
          # 部署前替换为当前地域 ACR 镜像，例如 registry.cn-hongkong.aliyuncs.com/your-ns/zora:v0.12.0。
          image: registry.example.com/zora/zora:CHANGE_ME
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8088
          envFrom:
            - configMapRef:
                name: zora-config
          env:
            - name: ZORA_POSTGRES_DSN_FILE
              value: /var/run/zora-secrets/postgres-dsn
            - name: ZORA_REDIS_URL_FILE
              value: /var/run/zora-secrets/redis-url
            - name: ZORA_GITHUB_OAUTH_CLIENT_SECRET_FILE
              value: /var/run/zora-secrets/github-client-secret
            - name: ZORA_METRICS_TOKEN_FILE
              value: /var/run/zora-secrets/metrics-token
            - name: ZORA_LLM_API_KEY_FILE
              value: /var/run/zora-secrets/llm-api-key
            - name: ZORA_EMBEDDING_API_KEY_FILE
              value: /var/run/zora-secrets/embedding-api-key
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: secret-runtime
              mountPath: /var/run/zora-secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: zora
      volumes:
        - name: secret-input
          secret:
            secretName: zora-secrets
            defaultMode: 0400
        - name: secret-runtime
          emptyDir:
            medium: Memory
        - name: tmp
          emptyDir: {}
