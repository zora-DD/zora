apiVersion: v1
kind: Secret
metadata:
  name: zora-secrets
  namespace: zora
type: Opaque
stringData:
  # 这是字段模板，不得填写真实值后提交到 Git。建议由阿里云 KMS/Secrets Manager 或 CI 注入。
  postgres-dsn: "postgres://CHANGE_ME@CHANGE_ME:5432/zora?sslmode=require"
  redis-url: "rediss://:CHANGE_ME@CHANGE_ME:6379/0"
  github-client-secret: "CHANGE_ME"
  metrics-token: "CHANGE_ME_RANDOM_32_BYTES"
  llm-api-key: "CHANGE_ME"
  embedding-api-key: "CHANGE_ME"
  # AI 配置也按敏感信息管理；只能引用上面的 Key 环境变量，严禁增加 api_key 字段。
  ai-config.json: |
    {
      "version": 1,
      "default_model_id": "primary",
      "models": [
        {
          "id": "primary",
          "name": "主模型",
          "provider": "openai",
          "model": "CHANGE_ME_LLM_MODEL",
          "base_url": "CHANGE_ME_LLM_BASE_URL",
          "api_key_env": "ZORA_LLM_API_KEY"
        }
      ],
      "embedding": {
        "provider": "openai",
        "model": "CHANGE_ME_EMBEDDING_MODEL",
        "base_url": "CHANGE_ME_EMBEDDING_BASE_URL",
        "dimensions": 1024,
        "api_key_env": "ZORA_EMBEDDING_API_KEY"
      }
    }
